name: ClinicPass V2 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicpass_ci
          POSTGRES_USER: clinicpass
          POSTGRES_PASSWORD: clinicpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinicpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://clinicpass:clinicpass@localhost:5432/clinicpass_ci
      CSRF_ENABLED: "false"
      CLINICPASS_V2_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Migration upgrade, rollback, and re-upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade 0004_durable_document_content
          uv run alembic upgrade head
      - run: uv run --extra dev ruff check app tests
      - run: uv run --extra dev mypy app
      - run: uv run --extra dev pytest -q
      - name: Mock Clinic Assist 2.0.0 contract tests
        run: uv run python ../mock-clinic-assist/test_server.py
      - run: uv run --extra dev python ../../scripts/run-v2-benchmark.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify sanitized public export
        env:
          PUBLIC_EXPORT_REQUIRE_OUTPUT: "false"
        run: |
          make export-public
          make verify-public
