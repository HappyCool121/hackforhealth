name: clinicpass

services:
  gateway:
    image: caddy:2.10-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8000
      BACKEND_GATEWAY_SECRET: ${BACKEND_GATEWAY_SECRET:?Set BACKEND_GATEWAY_SECRET in .env}
      NEXT_PUBLIC_APP_NAME: ClinicPass
      SHOW_DEMO_CREDENTIALS: ${SHOW_DEMO_CREDENTIALS:-true}
      STAFF_ASSISTANT_EMAIL: ${STAFF_ASSISTANT_EMAIL:-assistant@clinicpass.test}
      STAFF_ASSISTANT_PASSWORD: ${STAFF_ASSISTANT_PASSWORD:?Set STAFF_ASSISTANT_PASSWORD in .env}
      STAFF_MANAGER_EMAIL: ${STAFF_MANAGER_EMAIL:-manager@clinicpass.test}
      STAFF_MANAGER_PASSWORD: ${STAFF_MANAGER_PASSWORD:?Set STAFF_MANAGER_PASSWORD in .env}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./services/api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinicpass:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/clinicpass
      UPLOAD_DIR: /data/uploads
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      IDENTITY_HMAC_KEY: ${IDENTITY_HMAC_KEY:?Set IDENTITY_HMAC_KEY in .env}
      BACKEND_GATEWAY_SECRET: ${BACKEND_GATEWAY_SECRET:?Set BACKEND_GATEWAY_SECRET in .env}
      CLINIC_ASSIST_SECRET: ${CLINIC_ASSIST_SECRET:?Set CLINIC_ASSIST_SECRET in .env}
      CLINIC_ASSIST_URL: http://mock-clinic-assist:8090/api/v1/patients
    expose:
      - "8000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: ./services/api
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinicpass:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/clinicpass
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./services/api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinicpass:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/clinicpass
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clinicpass
      POSTGRES_USER: clinicpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicpass -d clinicpass"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    expose:
      - "1025"

  mock-clinic-assist:
    build: ./services/mock-clinic-assist
    environment:
      CLINIC_ASSIST_SECRET: ${CLINIC_ASSIST_SECRET:?Set CLINIC_ASSIST_SECRET in .env}
    expose:
      - "8090"

volumes:
  postgres-data:
  uploads:
